repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff            # lint (auto-fixes what it safely can)
        args: [--fix]
        files: ^proto/
      - id: ruff-format     # format
        files: ^proto/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (core)
        entry: bash -c 'cd core && cargo fmt --all -- --check'
        language: system
        types: [rust]
        pass_filenames: false
